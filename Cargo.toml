[package]
name = "flowtox"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Order-flow toxicity for Rust: streaming VPIN, bulk volume classification, Lee-Ready and tick-rule trade signing, and the EKOP PIN model fitted by maximum likelihood. No default dependencies. Carved out of srfm-lab's microstructure-engine."
authors = ["Matthew Busel"]
license = "MIT"
repository = "https://github.com/Mattbusel/flowtox"
documentation = "https://docs.rs/flowtox"
keywords = ["vpin", "microstructure", "order-flow", "trading", "finance"]
categories = ["finance", "mathematics", "algorithms"]
include = ["src/**/*", "tests/**/*", "examples/**/*", "docs/**/*", "Cargo.toml", "LICENSE", "NOTICE", "CHANGELOG.md"]

[features]
default = []
## Serialize and Deserialize for parameters, fits, bars and sides.
serde = ["dep:serde"]
## `ta::Next` and `ta::Reset` impls, so flowtox indicators drop into code built on the `ta` crate.
ta = ["dep:ta"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
ta = { version = "0.5", optional = true, default-features = false }

[[example]]
name = "ta_next"
required-features = ["ta"]

[package.metadata.docs.rs]
all-features = true
