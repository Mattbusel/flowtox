[package]
name = "flowtox"
version = "0.1.1"
edition = "2021"
rust-version = "1.81"
description = "If you quote without measuring who is on the other side, you are the liquidity informed traders pick off. Streaming VPIN with exact bucket splitting, bulk volume classification, Lee-Ready and tick-rule signing, and the EKOP PIN by maximum likelihood. No default dependencies; ta::Next optional."
authors = ["Matthew Busel"]
license = "MIT"
repository = "https://github.com/Mattbusel/flowtox"
documentation = "https://docs.rs/flowtox"
keywords = ["vpin", "order-flow", "market-making", "microstructure", "toxicity"]
categories = ["finance", "mathematics", "algorithms"]
include = ["src/**/*", "tests/**/*", "examples/**/*", "docs/**/*", "Cargo.toml", "LICENSE", "NOTICE", "CHANGELOG.md", "README.md"]

[features]
default = []
## Serialize and Deserialize for parameters, fits, bars and sides.
serde = ["dep:serde"]
## `ta::Next` and `ta::Reset` impls, so flowtox indicators drop into code built on the `ta` crate.
ta = ["dep:ta"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
ta = { version = "0.5", optional = true, default-features = false }

[[example]]
name = "ta_next"
required-features = ["ta"]

[package.metadata.docs.rs]
all-features = true
